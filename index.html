<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ভূমি বন্ধু — ভূমি সেবা চ্যাটবট</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#041f1a; --bg2:#0a4a3a; --bg3:#0d6b4f;
    --card:rgba(255,255,255,.065);
    --line:rgba(255,255,255,.13);
    --bot-bub:#ffffff; --bot-txt:#12302a;
    --user-grad:linear-gradient(135deg,#00c48c,#0a9a6c);
    --accent:#25d399; --accent-soft:rgba(37,211,153,.16);
    --muted:rgba(255,255,255,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Hind Siliguri","Noto Sans Bengali",Vrinda,"Segoe UI",sans-serif;
    color:#fff;
    background:
      radial-gradient(1100px 540px at 88% -12%, rgba(18,146,108,.55) 0%, transparent 62%),
      radial-gradient(820px 480px at -12% 112%, rgba(10,92,70,.75) 0%, transparent 55%),
      linear-gradient(140deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    display:flex;align-items:center;justify-content:center;padding:14px;
    overflow:hidden;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background:radial-gradient(720px 320px at 50% 0%, rgba(0,0,0,0), rgba(0,0,0,.28) 100%);
  }
  .app{
    position:relative;width:100%;max-width:540px;height:min(94vh,820px);
    background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--line);border-radius:28px;overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 34px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  }
  header{
    display:flex;align-items:center;gap:12px;padding:13px 14px 11px;
    background:rgba(0,0,0,.24);border-bottom:1px solid var(--line);
  }
  .avatar{
    position:relative;width:46px;height:46px;border-radius:15px;flex:none;
    background:linear-gradient(135deg,#00c48c,#0a7a58);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(0,196,140,.38);
    overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .avatar::after{
    content:"";position:absolute;right:2px;bottom:2px;width:11px;height:11px;border-radius:50%;
    background:#35e6a6;border:2px solid #063427;
  }
  .titles{flex:1;min-width:0}
  h1{font-size:18.5px;font-weight:700;line-height:1.25;letter-spacing:.2px}
  h1 small{display:inline-block;font-size:10px;font-weight:600;color:#0faa79;background:rgba(15,170,121,.16);
    border:1px solid rgba(15,170,121,.45);padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
  .status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
  .dot{width:8px;height:8px;border-radius:50%;background:#35e6a6;animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(53,230,166,0)}100%{box-shadow:0 0 0 0 rgba(53,230,166,0)}}
  .hbtns{display:flex;gap:8px;flex:none}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:#fff;cursor:pointer;transition:.2s;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn svg{width:17px;height:17px;fill:currentColor}
  #langBtn{width:auto;padding:0 10px;gap:5px}
  #langBtn span{font-family:inherit;font-size:12.5px;font-weight:600}
  .icon-btn:hover{background:rgba(255,255,255,.13)}
  .clear-btn:hover{background:rgba(255,80,80,.22);border-color:rgba(255,120,120,.5)}
  #chat{flex:1;overflow-y:auto;padding:18px 14px 10px;scroll-behavior:smooth}
  #chat::-webkit-scrollbar{width:6px}
  #chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
  #chat::-webkit-scrollbar-track{background:transparent}
  .msg{max-width:87%;margin-bottom:13px;animation:pop .28s ease;display:flex;flex-direction:column}
  @keyframes pop{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .bot{align-self:flex-start;align-items:flex-start}
  .user{align-self:flex-end;align-items:flex-end}
  .bubble{
    padding:11px 14px;border-radius:17px;font-size:14.5px;line-height:1.68;
    word-wrap:break-word;overflow-wrap:anywhere;
    text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
  }
  .bubble p{margin:2px 0}
  .bubble p+p{margin-top:7px}
  .bubble .lead{font-size:15.5px;font-weight:600;margin-bottom:4px}
  .bubble .h{
    font-weight:700;color:#0a7a58;
    margin:10px 0 3px;padding-bottom:2px;
  }
  .bubble .h:first-child{margin-top:0}
  .bubble ul,.bubble ol{margin:5px 0 4px;padding-left:21px}
  .bubble li{margin:2px 0;padding-left:3px;text-indent:0}
  .bubble li::marker{color:#0aa06e;font-weight:700}
  .bubble li+li{margin-top:4px}
  .bubble strong{font-weight:700;color:#073227}
  .bubble em{font-style:italic;color:#0a6a4e}
  .bot .bubble{
    background:var(--bot-bub);color:var(--bot-txt);
    border-bottom-left-radius:6px;
    box-shadow:0 4px 14px rgba(0,0,0,.16);
  }
  .user .bubble{
    background:var(--user-grad);color:#fff;border-bottom-right-radius:6px;
    box-shadow:0 7px 18px rgba(0,180,130,.3);
  }
  .bubble a{color:#0aa06e;font-weight:600;text-decoration:underline;text-underline-offset:2px}
  .user .bubble a{color:#fff}
  .time{font-size:10.5px;color:var(--muted);margin:3px 6px 0}
  .typing{display:inline-flex;gap:5px;padding:13px 17px;background:var(--bot-bub);border-radius:17px;border-bottom-left-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
  .typing i{width:7px;height:7px;border-radius:50%;background:#0aa06e;animation:bnc 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bnc{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-5px);opacity:1}}
  .suggest-label{font-size:12px;color:var(--muted);margin:2px 2px 8px}
  .suggest-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
  .suggest-row button{
    border:1px solid rgba(37,211,153,.5);background:var(--accent-soft);color:#7df0c8;
    font-family:inherit;font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;transition:.18s;
  }
  .suggest-row button:hover{background:rgba(37,211,153,.3);color:#fff}
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:10px 12px 6px;scrollbar-width:none;flex:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chips button{
    flex:none;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#d9fff1;
    font-family:inherit;font-size:13px;padding:7px 15px;border-radius:999px;cursor:pointer;transition:.18s;white-space:nowrap;
  }
  .chips button:hover{background:var(--user-grad);border-color:transparent;color:#fff}
  .composer{position:relative;flex:none}
  .live-sug{
    position:absolute;left:10px;right:10px;bottom:100%;z-index:40;display:none;margin-bottom:8px;
    background:rgba(8,38,31,.97);border:1px solid rgba(37,211,153,.32);border-radius:16px;overflow:hidden;
    box-shadow:0 20px 44px rgba(0,0,0,.55);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  }
  .live-sug.on{display:block;animation:dropin .16s ease}
  @keyframes dropin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .live-sug .lab{font-size:11px;color:var(--muted);padding:8px 13px 5px;letter-spacing:.2px}
  .live-sug ul{list-style:none;max-height:min(216px,38vh);overflow-y:auto;padding:0 6px 6px;overscroll-behavior:contain}
  .live-sug ul::-webkit-scrollbar{width:5px}
  .live-sug ul::-webkit-scrollbar-thumb{background:rgba(37,211,153,.35);border-radius:3px}
  .live-sug li{
    display:block;padding:8px 11px;border-radius:10px;font-size:13.5px;line-height:1.5;
    color:#d9fff1;cursor:pointer;transition:background .12s,color .12s;
  }
  .live-sug li .mark{color:var(--accent);font-weight:700;margin-right:6px}
  .live-sug li.on{background:var(--accent-soft);color:#fff}
  .live-sug .hintrow{
    font-size:10.5px;color:rgba(255,255,255,.34);padding:6px 13px 7px;
    border-top:1px solid var(--line);background:rgba(0,0,0,.18);
  }
  form{display:flex;gap:9px;padding:10px 12px 11px;flex:none}
  #inp{
    flex:1;min-width:0;background:rgba(255,255,255,.09);border:1px solid var(--line);outline:none;color:#fff;
    font-family:inherit;font-size:15px;padding:12px 18px;border-radius:999px;transition:border .2s, background .2s;
  }
  #inp::placeholder{color:rgba(255,255,255,.4)}
  #inp:focus{border-color:var(--accent);background:rgba(255,255,255,.13)}
  .send{
    flex:none;width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;color:#fff;
    background:var(--user-grad);box-shadow:0 8px 20px rgba(0,180,130,.4);transition:.2s;
    display:flex;align-items:center;justify-content:center;
  }
  .send svg{width:20px;height:20px;fill:#fff}
  .send:hover{filter:brightness(1.12)}.send:active{transform:scale(.92)}
  .hint{display:flex;align-items:center;justify-content:center;gap:6px;padding-bottom:8px}
  .hint svg{width:11px;height:11px;fill:rgba(255,255,255,.4)}
  .hint span{font-size:10.5px;color:rgba(255,255,255,.38)}
  footer{text-align:center;font-size:11px;color:rgba(255,255,255,.34);padding:0 18px 10px;flex:none}
  @media(max-width:430px){
    body{padding:0}
    .app{height:100dvh;max-height:none;border-radius:0;border:none}
    h1{font-size:17px}.bubble{font-size:14px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">
      <img src="bhumi-pedia-logo.png" alt="ভূমি বন্ধু লোগো">
    </div>
    <div class="titles">
      <h1>ভূমি বন্ধু <small>OFFLINE</small></h1>
      <div class="status"><span class="dot"></span><span id="statusTxt">চ্যাটবট প্রস্তুত হচ্ছে…</span></div>
    </div>
    <div class="hbtns">
      <button class="icon-btn" id="langBtn" title="ভাষা / Language"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm8 10c0 .7-.08 1.4-.23 2h-4.06a17 17 0 0 0 .18-2 17 17 0 0 0-.18-2h4.06c.15.6.23 1.3.23 2zM12 20.9c-.8-.9-1.5-2.4-1.85-4.9h3.7c-.35 2.5-1.05 4-1.85 4.9zM10.1 14a19 19 0 0 1 0-4h3.8a19 19 0 0 1 0 4h-3.8zM6 12c0-.7.06-1.4.18-2h4.13A19 19 0 0 0 10.1 12a19 19 0 0 0 .2 2H6.18A8 8 0 0 1 6 12zm11.7 0a19 19 0 0 1-.18 2h-3.72a19 19 0 0 0 .2-2 19 19 0 0 0-.2-2h3.72a8 8 0 0 1 .18 2zM12 3.1c.8.9 1.5 2.4 1.85 4.9h-3.7c.35-2.5 1.05-4 1.85-4.9zM3.23 10H7.5a19 19 0 0 0-.2 2 19 19 0 0 0 .2 2H3.23A7.96 7.96 0 0 1 3 12c0-.7.06-1.4.18-2z"/></svg><span id="langLabel">বাংলা</span></button>
      <button class="icon-btn clear-btn" id="clearBtn" title="চ্যাট মুছুন"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg></button>
    </div>
  </header>
  <div id="chat"></div>
  <div class="chips" id="chips"></div>
  <div class="composer">
    <div class="live-sug" id="liveSug"></div>
    <form id="form" autocomplete="off">
      <input id="inp" type="text" placeholder="আপনার প্রশ্ন লিখুন…" maxlength="500" autofocus
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="liveSugList">
      <button class="send" type="submit" title="পাঠান"><svg viewBox="0 0 24 24"><path d="M3.4 20.4 20.85 12 3.4 3.6l2.5 7.2H15l-2 3.9z"/></svg></button>
    </form>
  </div>
  <div class="hint"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1 4h2v8h-2zm0 10h2v2h-2z"/></svg><span>এন্টার চাপুন • সম্পূর্ণ অফলাইনে চলে • কোনো ইন্টারনেট লাগে না</span></div>
  <footer>উৎস: iLKMS আইন-বিধি, ধারা ও ব্লগ ডাটাবেস • বাংলা ও ইংরেজি উভয় ভাষায় চ্যাট করা যায়</footer>
</div>

<script src="data.js?v=9"></script>
<script src="docs.js?v=9"></script>
<script src="app.js?v=9"></script>
<script>
  // Optional: point the chatbot at the live API server (server.py).
  // Answers then come from the live iLKMS database; data.js is an offline
  // fallback when this server (or its DB) is unreachable. Leave empty to
  // always use the bundled offline dataset.
  window.__BHUMI_API__ = "";
  (function () {
    var langBtn = document.getElementById("langBtn");
    var langLabel = document.getElementById("langLabel");
    if (!window.__bhumi) return;
    function refresh() {
      var lang = window.__bhumi.getLang();
      langLabel.textContent = lang === "bn" ? "বাংলা" : "English";
      langBtn.title = lang === "bn" ? "English এ স্যুইচ করুন" : "Switch to বাংলা";
    }
    langBtn.addEventListener("click", function () {
      var next = window.__bhumi.getLang() === "bn" ? "en" : "bn";
      window.__bhumi.setLang(next);
      refresh();
      langBtn.style.pointerEvents = "none";
      setTimeout(function () { langBtn.style.pointerEvents = ""; }, 500);
    });
    refresh();
  })();
</script>
</body>
</html>
